  <text x="78" y="332" fill="#f7f5fa" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3.2">Ideas with a</text>
  <text x="78" y="413" fill="#f7f5fa" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3.2">commercial edge.</text>
  <rect x="81" y="464" width="84" height="6" rx="3" fill="#ff2d95"/>
