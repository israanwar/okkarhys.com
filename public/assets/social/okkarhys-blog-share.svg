<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Okkarhys Journal</title>
  <desc id="description">A dark editorial social card for Okkarhys articles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.54" stop-color="#11152c"/>
      <stop offset="1" stop-color="#150b25"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(908 126) rotate(132) scale(510 580)">
      <stop stop-color="#6d4cf5" stop-opacity=".88"/>
      <stop offset=".48" stop-color="#5e3fd9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5e3fd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientTransform="translate(202 570) rotate(-33) scale(420 340)">
      <stop stop-color="#ff2d95" stop-opacity=".52"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8d0dd" stroke-opacity=".065"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="910" cy="126" rx="250" ry="190" fill="#6d4cf5" fill-opacity=".34" filter="url(#blur)"/>
  <ellipse cx="205" cy="588" rx="240" ry="145" fill="#ff2d95" fill-opacity=".23" filter="url(#blur)"/>
  <rect width="1200" height="630" fill="url(#violetGlow)"/>
  <rect width="1200" height="630" fill="url(#pinkGlow)"/>

  <g transform="translate(76 69)">
    <path d="M0 44A31 31 0 0 1 37.4 0" fill="none" stroke="#d8d0dd" stroke-width="11"/>
    <path d="M51 11A31 31 0 0 1 15 57" fill="none" stroke="#7d61fb" stroke-width="11"/>
